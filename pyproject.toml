[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsight"
version = "0.1.0"
description = "OpenAI-compatible vision proxy that gives text-only LLMs interactive vision via a vision-session loop."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Reality Shifting Tech", email = "elias@realityshifting.tech" },
]
keywords = ["vision", "llm", "vlm", "proxy", "openai-compatible", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
deepsight = "deepsight.__main__:main"

[project.urls]
Homepage = "https://github.com/Reality-Shifting-Tech/deepsight"
Repository = "https://github.com/Reality-Shifting-Tech/deepsight"
Source = "https://github.com/Reality-Shifting-Tech/deepsight"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
disallow_untyped_defs = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
