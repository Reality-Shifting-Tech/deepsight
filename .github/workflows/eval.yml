name: eval

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  eval:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Gates (lint + typecheck + tests)
        run: make all

      - name: Eyes eval (compile swift from repo source, synth + public images, golden photos skipped)
        run: make eval-eyes-ci
